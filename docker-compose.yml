name: prastuti-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prastuti
      POSTGRES_USER: prastuti
      POSTGRES_PASSWORD: prastuti-local
    ports:
      - "${PRASTUTI_POSTGRES_PORT:-54329}:5432"
    volumes:
      - prastuti-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prastuti -d prastuti"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${PRASTUTI_VALKEY_PORT:-63799}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  prastuti-postgres:
