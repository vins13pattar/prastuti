name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Scan repository and history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose --no-banner

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prastuti
          POSTGRES_USER: prastuti
          POSTGRES_PASSWORD: prastuti-local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U prastuti -d prastuti"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Build
        run: pnpm build

      - name: Migrate local PostgreSQL
        run: pnpm local:db:migrate

      - name: Verify PostgreSQL invariants
        run: pnpm local:postgres:verify

      - name: Smoke test persistent product mode
        run: pnpm local:persistent:smoke

      - name: Smoke test local product mode
        run: pnpm local:smoke
