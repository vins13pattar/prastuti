allowBuilds:
  '@swc/core': true
  cbor-extract: true
  esbuild: true
  sharp: true
  unrs-resolver: true

auditConfig:
  # Workflow 4.6.1 still carries brace-expansion 1.x/2.x through build-only
  # CLI packages. Prastuti does not pass request data to their glob APIs. The
  # runtime-facing 5.x path is pinned to the patched release below.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "@modelcontextprotocol/sdk>@hono/node-server": 2.0.10
  brace-expansion@5.0.7: 5.0.8
  postcss@<=8.5.11: 8.5.22
  sharp@<0.35.0: 0.35.3
